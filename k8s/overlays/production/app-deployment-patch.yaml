apiVersion: apps/v1
kind: Deployment
metadata:
  name: postic-ml-app
  namespace: postic-ml
spec:
  template:
    spec:
      containers:
      - name: postic-ml-app
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
